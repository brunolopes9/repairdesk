server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/wasm image/svg+xml;
    gzip_min_length 1024;

    # Assets com hash — cache longo
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Sprint 690: callback do ifthenpay — a chave anti-phishing vem na query; não fica no access log.
    location ~ ^/api/public/loja/[^/]+/ifthenpay/callback$ {
        access_log off;
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 20/11: foto de fatura em papel — a leitura pela subscrição (Opus) demora 1–3 min.
    location = /api/supplier-invoices/upload-photo {
        proxy_pass http://api:8080/api/supplier-invoices/upload-photo;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 30m;
    }

    # API proxy
    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        # Sprint 632: faturas por email (MIME com PDFs) e uploads de despesas — o nginx por omissão só aceita 1 MB.
        client_max_body_size 30m;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
