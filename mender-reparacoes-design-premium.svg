    <path d="M26 268h24M26 282h24M31 258h14" stroke="#b8c5d6" stroke-width="3" stroke-linecap="round"/>
    <rect x="16" y="238" width="44" height="44" rx="12" fill="#2f80d1"/>
    <path d="M28 260l20 20M48 260l-20 20" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
