<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <filter id="shadow-sm" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#0f172a" flood-opacity=".08"/>
    </filter>
    <filter id="shadow-lg" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#0f172a" flood-opacity=".16"/>
    </filter>
    <style>
      .font{font-family:Inter,Segoe UI,Arial,sans-serif}
      .bg{fill:#f6f4ef}
      .surface{fill:#fffdf8}
      .card{fill:#fff;stroke:#dedbd2;stroke-width:1}
      .muted{fill:#667085}
      .text{fill:#111827}
      .line{stroke:#dedbd2;stroke-width:1}
      .nav{fill:#0e1b2a}
      .blue{fill:#2f80d1}
      .blueSoft{fill:#e7f2ff}
      .blueText{fill:#1f6fb8}
      .green{fill:#16a36a}
      .greenSoft{fill:#e8f8ef}
      .amber{fill:#b7791f}
      .amberSoft{fill:#fff5da}
      .red{fill:#c73535}
      .redSoft{fill:#ffe9e9}
      .chip{fill:#f1f0ea}
      .h1{font-size:30px;font-weight:780}
      .h2{font-size:19px;font-weight:760}
      .body{font-size:15px}
      .small{font-size:13px}
      .tiny{font-size:11px}
      .label{font-size:11px;font-weight:760;letter-spacing:.05em}
    </style>
  </defs>

  <rect width="1920" height="1080" class="bg"/>

  <!-- Sidebar -->
  <rect x="0" y="0" width="72" height="1080" class="nav"/>
  <rect x="16" y="18" width="40" height="40" rx="12" class="blue"/>
  <text x="36" y="44" text-anchor="middle" class="font" font-size="17" font-weight="800" fill="#fff">M</text>
  <g class="font" text-anchor="middle" font-size="21" fill="#b8c5d6">
    <text x="36" y="142">▦</text>
    <text x="36" y="204">☉</text>
    <rect x="10" y="232" width="52" height="52" rx="12" class="blue"/>
    <text x="36" y="265" fill="#fff">⌕</text>
    <text x="36" y="328">⏱</text>
    <text x="36" y="390">▣</text>
    <text x="36" y="452">€</text>
    <text x="36" y="514">▰</text>
    <text x="36" y="576">◇</text>
    <text x="36" y="638">#</text>
    <text x="36" y="700">▤</text>
    <text x="36" y="762">⚙</text>
  </g>

  <!-- Top bar -->
