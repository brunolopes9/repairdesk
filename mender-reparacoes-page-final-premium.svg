  <rect x="1232" y="16" width="300" height="44" rx="9" fill="#fff" stroke="#dedbd2"/>
  <text x="1262" y="44" class="font muted" font-size="15">Procurar...</text>
  <rect x="1456" y="25" width="58" height="24" rx="6" fill="#f3f1eb" stroke="#dedbd2"/>
