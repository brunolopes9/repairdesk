  <text x="121" y="43" text-anchor="middle" class="font" font-size="17" font-weight="800" fill="#fff">M</text>
  <text x="152" y="43" class="font text" font-size="18" font-weight="760">Mender</text>
  <rect x="1030" y="16" width="188" height="44" rx="9" class="blue" filter="url(#shadow-sm)"/>
