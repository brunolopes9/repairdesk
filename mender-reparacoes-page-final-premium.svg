      <text x="317" y="27" text-anchor="middle" class="font small amber" font-weight="760">1 pendente fatura</text>
      <rect x="412" y="0" width="102" height="42" rx="9" fill="#fff" stroke="#dedbd2"/>
      <text x="463" y="27" text-anchor="middle" class="font small text" font-weight="760">Exportar</text>
