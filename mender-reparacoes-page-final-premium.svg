  <rect x="1734" y="23" width="30" height="30" rx="8" class="blueSoft"/>
  <text x="1749" y="44" text-anchor="middle" class="font blueText" font-size="15" font-weight="760">B</text>
  <text x="1776" y="43" class="font text" font-size="15" font-weight="650">Bruno Lopes</text>

